'''

(root / "main.py").write_text(main_py.strip() + "\n", encoding="utf-8")
(root / "buildozer.spec").write_text(buildozer_spec.strip() + "\n", encoding="utf-8")
(root / ".github/workflows/build-apk.yml").write_text(workflow.strip() + "\n", encoding="utf-8")
